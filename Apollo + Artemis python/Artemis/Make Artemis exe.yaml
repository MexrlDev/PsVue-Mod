# --- This makes both 32 and 64 bit zip files.---
# --- PUT THE PYTHON IN ROOT OF REPO source/* 
name: Build EXE (x86 + x64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [x64, x86]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # --- Setup Python ---
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        architecture: ${{ matrix.arch }}

    # --- Install dependencies ---
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pygame

    # --- Build EXE with icon ---
    - name: Build with PyInstaller
      shell: pwsh
      run: |
        pyinstaller --onefile --noconsole `
        --name Artemis_${{ matrix.arch }} `
        --icon source/data/app_icon.ico `
        --add-data "source/data;data" `
        source/main.py

    # --- Prepare release folder ---
    - name: Prepare package
      run: |
        mkdir release
        copy dist\Artemis_${{ matrix.arch }}.exe release\

    # --- Zip artifact ---
    - name: Create ZIP
      run: |
        powershell Compress-Archive -Path release\* -DestinationPath Artemis_${{ matrix.arch }}.zip

    # --- Upload artifact ---
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Artemis-${{ matrix.arch }}
        path: Artemis_${{ matrix.arch }}.zip
